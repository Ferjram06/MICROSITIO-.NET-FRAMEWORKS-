
<a class="skip-link" href="#main-content">
  Saltar al contenido principal
</a>

<header class="site-header">
  <a
    class="brand"
    routerLink="/inicio"
    aria-label="Campus Guía, inicio"
  >
    <span class="brand-icon" aria-hidden="true">C</span>
    <span>Campus Guía</span>
  </a>

  <nav class="main-nav" aria-label="Navegación principal">
    <a
      routerLink="/inicio"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      INICIO
    </a>

    <a
      routerLink="/recursos"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      RECURSOS
    </a>

    <a
      routerLink="/actividades"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      ACTIVIDADES
    </a>

    <a
      routerLink="/explorador"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      EXPLORADOR
    </a>

    <a
      routerLink="/acerca"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      ACERCA DE
    </a>
  </nav>
   <button
  class="theme-toggle"
  type="button"
  (click)="cambiarTema()"
  [attr.aria-label]="modoOscuro
    ? 'Cambiar a modo claro'
    : 'Cambiar a modo oscuro'"
  [attr.aria-pressed]="modoOscuro"
  title="Cambiar tema"
>
  <span aria-hidden="true">
    {{ modoOscuro ? '☀' : '☾' }}
  </span>
</button>
</header>

<main id="main-content" class="page-container" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <span>Campus Guía · Práctica 9 — Frameworks</span>
</footer>
